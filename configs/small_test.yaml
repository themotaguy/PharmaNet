# Tiny instance for fast unit/regression tests (2 plants, 3 DCs, 3 regions, 2 products).
# Note: the hand-verified regression test in Phase 4 will use hand-written
# parameters, not generated ones, so its optimum can be checked on paper.

run:
  name: small_test
  seed: 7
  output_dir: outputs

network:
  n_plants: 2
  n_dcs: 3
  n_regions: 3
  n_products: 2
  n_months: 36
  grid_size: 100.0

generation:
  start_month: "2023-01"           # first month of demand history (YYYY-MM)
  products:
    cold_fraction: 0.5
    intermittent_fraction: 0.0
    unit_value: {low: 50.0, high: 100.0}
    shelf_life_months: {low: 12, high: 24}
  plants:
    qualification_prob: 1.0
    capacity_slack: {low: 1.5, high: 1.5}
  dcs:
    fixed_cost: {low: 1000.0, high: 2000.0}
    throughput_slack: {low: 2.0, high: 2.0}
    no_cold_fraction: 0.0
    cold_share: {low: 0.5, high: 0.5}
  demand:
    base_level: {low: 100.0, high: 200.0}
    annual_trend: {low: 0.0, high: 0.05}
    seasonal_amplitude: {low: 0.1, high: 0.2}
    noise_cv: {low: 0.05, high: 0.1}
    intermittent_zero_prob: 0.5

costs:
  transport_per_unit_distance: 0.01
  cold_chain_premium: 1.5
  unmet_penalty_multiplier: 10.0

lead_times:
  plant_dc_base_days: 2.0
  dc_region_base_days: 1.0
  days_per_unit_distance: 0.05
  cv: 0.2

forecasting:
  models: [seasonal_naive, ets]
  seasonal_period: 12
  horizon: 12
  backtest_months: 12
  selection_metric: wape           # lowest backtest WAPE wins
  selection_strategy: per_series   # per_series | global (one model for all series; see docs)
  selection_holdout_months: 6      # honest estimate: choose on first 6 backtest months, score on last 6
  n_jobs: 1                     # parallel processes for the backtest (null = all cores)
  ets:                             # Holt-Winters: damped additive trend, additive seasonality
    trend: add
    damped_trend: true
    seasonal: add                  # additive (not multiplicative) so zero-demand months are OK
  sarima:                          # SARIMA(p,d,q)(P,D,Q)_12
    order: [1, 0, 0]
    seasonal_order: [0, 1, 1]
    trend: c                       # constant on the seasonally-differenced series = linear trend

inventory:
  service_level: 0.95

optimization:
  solver:
    name: highs
    time_limit_s: 30
    mip_gap: 0.0
  strong_linking: true             # (C6) tightens the LP relaxation; optimum unchanged
  single_sourcing: false           # true = each region served by exactly one DC
  max_open_dcs: null
  n_minus_1_dc: false              # true = resilient design (survive loss of any one DC)
  ss_refinement_iterations: 1      # re-solve after recomputing SS with actual lead times

simulation:
  demand_common_shock_share: 0.5   # product-level shock shared by all regions (0 = independent)
  outage_capacity_loss: 1.0        # plant outage removes this share of annual capacity
  n_jobs: 1                     # parallel processes (null = all cores)
  n_scenarios: 20
  disruptions:
    plant_outage: true
    dc_outage: true
    cold_lane_failure: true
  sensitivity:
    fixed_cost_multipliers: [0.8, 1.0, 1.2]
    transport_cost_multipliers: [0.8, 1.0, 1.2]
    demand_multipliers: [0.8, 1.0, 1.2]

graph:
  backup_capacity_share: 1.0       # dual-qualification mitigation: backup plant capacity / product demand

report:
  benchmark_seeds: 2               # MILP vs greedy on seeds 1..N in run-all (0 = skip)

stochastic:                        # two-stage stochastic design (Phase 8)
  enabled: true
  n_scenarios: 4                  # in-sample demand scenarios (extensive form size scales with this)
  disruption_weight: 0.1           # probability mass on single plant / candidate-DC outages
  n_eval_scenarios: 10             # fresh out-of-sample scenarios to compare designs
  compute_wait_and_see: true       # one MILP per scenario -> WS, EVPI
