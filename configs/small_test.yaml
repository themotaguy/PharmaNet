# Tiny instance for fast unit/regression tests (2 plants, 3 DCs, 3 regions, 2 products).
# Note: the hand-verified regression test in Phase 4 will use hand-written
# parameters, not generated ones, so its optimum can be checked on paper.

run:
  name: small_test
  seed: 7
  output_dir: outputs

network:
  n_plants: 2
  n_dcs: 3
  n_regions: 3
  n_products: 2
  n_months: 36
  grid_size: 100.0

generation:
  products:
    cold_fraction: 0.5
    intermittent_fraction: 0.0
    unit_value: {low: 50.0, high: 100.0}
    shelf_life_months: {low: 12, high: 24}
  plants:
    qualification_prob: 1.0
    capacity_slack: {low: 1.5, high: 1.5}
  dcs:
    fixed_cost: {low: 1000.0, high: 2000.0}
    throughput_slack: {low: 2.0, high: 2.0}
    no_cold_fraction: 0.0
    cold_share: {low: 0.5, high: 0.5}
  demand:
    base_level: {low: 100.0, high: 200.0}
    annual_trend: {low: 0.0, high: 0.05}
    seasonal_amplitude: {low: 0.1, high: 0.2}
    noise_cv: {low: 0.05, high: 0.1}
    intermittent_zero_prob: 0.5

costs:
  transport_per_unit_distance: 0.01
  cold_chain_premium: 1.5
  unmet_penalty_multiplier: 10.0

lead_times:
  plant_dc_base_days: 2.0
  dc_region_base_days: 1.0
  days_per_unit_distance: 0.05
  cv: 0.2

forecasting:
  models: [seasonal_naive, ets]
  seasonal_period: 12
  horizon: 12
  backtest_months: 12
  selection_metric: wape

inventory:
  service_level: 0.95

optimization:
  solver:
    name: highs
    time_limit_s: 30
    mip_gap: 0.0
  single_sourcing: false
  max_open_dcs: null

simulation:
  n_scenarios: 20
  disruptions:
    plant_outage: true
    dc_outage: true
    cold_lane_failure: true
  sensitivity:
    fixed_cost_multipliers: [0.8, 1.0, 1.2]
    transport_cost_multipliers: [0.8, 1.0, 1.2]
    demand_multipliers: [0.8, 1.0, 1.2]
