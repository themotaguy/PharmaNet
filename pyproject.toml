[project]
name = "pharmanet"
version = "0.1.0"
description = "Pharma supply network optimization and resilience analytics (synthetic data)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pyomo>=6.7",
    "highspy>=1.7",
    "statsmodels>=0.14",
    "networkx>=3.2",
]

[project.optional-dependencies]
# Results viewer (Phase 8). Install with: uv sync --extra viewer
viewer = ["streamlit>=1.40"]

[project.scripts]
pharmanet = "pharmanet.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "streamlit>=1.40",  # so CI can test the viewer; end users opt in via the extra
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmanet"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "NPY",      # numpy-specific
    "PD",       # pandas-vet
    "RUF",
]
ignore = [
    "N803", "N806",  # allow math-style names like X, P, D in optimization code
]

[tool.ruff.lint.per-file-ignores]
# The report renders human-readable Markdown: en dashes, minus and multiplication
# signs are intentional typography there, not typos for ASCII characters.
"src/pharmanet/report.py" = ["RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pharmanet"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship without type stubs.
module = ["pyomo.*", "highspy.*", "statsmodels.*", "networkx.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (full-size instances, many scenarios)",
]
